services:
  db:
    image: postgres:15
    volumes:
      - postgres_data:/var/lib/postgresql/data/
    environment:
      - POSTGRES_DB=${POSTGRES_DB:-tasknow_db}
      - POSTGRES_USER=${POSTGRES_USER:-tasknow_user}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:-tasknow_password}
    # No host port: the backend reaches the database over the compose network,
    # and publishing 5432 would collide with any other Postgres on the machine.
    # Uncomment to connect with a database client.
    # ports:
    #   - "127.0.0.1:5433:5432"
    restart: always

  backend:
    build: .
    volumes:
      - .:/app
    ports:
      - "127.0.0.1:8000:8000"
    environment:
      - POSTGRES_HOST=db
      - POSTGRES_DB=${POSTGRES_DB:-tasknow_db}
      - POSTGRES_USER=${POSTGRES_USER:-tasknow_user}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:-tasknow_password}
      - DJANGO_SECRET_KEY=${DJANGO_SECRET_KEY:-django-insecure-dev-only-key-do-not-use-in-production}
      - DJANGO_DEBUG=${DJANGO_DEBUG:-True}
      - DJANGO_ALLOWED_HOSTS=${DJANGO_ALLOWED_HOSTS:-localhost,127.0.0.1,backend}
    depends_on:
      - db
    restart: always

  frontend:
    build: ./frontend
    volumes:
      - ./frontend:/app
      # Keep the image's node_modules instead of the host's, which may be
      # missing or built for another platform.
      - /app/node_modules
    ports:
      - "127.0.0.1:3000:3000"
    environment:
      - CHOKIDAR_USEPOLLING=true
      - WATCHPACK_POLLING=true
      - WDS_SOCKET_PORT=0
    depends_on:
      - backend
    restart: always

volumes:
  postgres_data:
