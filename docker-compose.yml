version: '3.8'

services:
  db:
    image: postgres:15
    volumes:
      - postgres_data:/var/lib/postgresql/data/
    environment:
      - POSTGRES_DB=tasknow_db
      - POSTGRES_USER=tasknow_user
      - POSTGRES_PASSWORD=tasknow_password
    ports:
      - "5432:5432"
    restart: always

volumes:
  postgres_data:
